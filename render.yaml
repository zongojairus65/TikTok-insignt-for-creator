services:
  - type: web
    name: tikinsight-personal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COLLECTOR
        value: official
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
