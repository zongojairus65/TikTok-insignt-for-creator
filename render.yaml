services:
  - type: web
    name: tikinsight-personal
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COLLECTOR
        value: public
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
